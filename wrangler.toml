# ReefBuddy - Cloudflare Workers Configuration
# Backend for saltwater aquarium water chemistry analysis
#
# LAYOUT (P1-11): the top level IS production. `wrangler deploy` deploys production.
# Local development uses the `dev` environment: `wrangler dev --env dev` (npm run dev).
# There is deliberately no remote deploy of the dev environment: it shares the production
# D1/KV bindings below (local dev uses Miniflare storage, so nothing touches production data).
# If a remote dev Worker is ever wanted, give it its own D1 and KV first.

name = "reefbuddy"
main = "src/index.ts"
compatibility_date = "2026-08-15"

# Keep the *.workers.dev host until iOS 1.0.7 (custom domain) has shipped, then set false (C-03).
workers_dev = true
routes = [
  { pattern = "api.reefbuddy.aethers.com.au", custom_domain = true }
]

# D1 Database Binding
# Create with: npx wrangler d1 create reef-db
[[d1_databases]]
binding = "DB"
database_name = "reef-db"
database_id = "5171dac0-7584-49a2-956b-971f2516e0cd"

# KV Namespace Binding (sessions, rate limiting)
# Create with: npx wrangler kv namespace create REEF_KV
[[kv_namespaces]]
binding = "REEF_KV"
id = "b971329ac04e4171a65cfb907da0b08f"

[vars]
ENVIRONMENT = "production"
FREE_ANALYSIS_LIMIT = "3"
CF_ACCOUNT_ID = "34fe73a21dc07a799a1ded7cc1763895"
APPLE_BUNDLE_ID = "au.com.aethers.reefbuddy"
# Set to "true" only if TestFlight testers must be able to buy credits (Sandbox transactions).
ALLOW_SANDBOX_PURCHASES = "false"

# AI Gateway (all LLM calls go through it). Flattened to AI_GATEWAY_ID in P3-25.
[vars.AI_GATEWAY]
gateway_id = "reefbuddy-ai-gateway"

# Observability: Workers Logs at 100% sampling. Applies to every environment.
[observability.logs]
enabled = true
invocation_logs = true

# =============================================================================
# SECRETS (set with `wrangler secret put <NAME>`; never stored in this file)
#   ANTHROPIC_API_KEY      required  - Anthropic key used through AI Gateway
#   CF_AI_GATEWAY_TOKEN    required  - AI Gateway is in Authenticated mode
#   APPLE_KEY_ID           required  - DeviceCheck key id (10 chars)
#   APPLE_PRIVATE_KEY      required  - DeviceCheck key, PKCS8 PEM
#   APPLE_TEAM_ID          required  - Apple Developer team id
# Local development reads the same names from .dev.vars (git-ignored).
# =============================================================================

# -----------------------------------------------------------------------------
# Local development environment: `wrangler dev --env dev`
# Distinct name so a mistaken `wrangler deploy --env dev` can never overwrite production.
# -----------------------------------------------------------------------------
[env.dev]
name = "reefbuddy-dev"
workers_dev = true

[[env.dev.d1_databases]]
binding = "DB"
database_name = "reef-db"
database_id = "5171dac0-7584-49a2-956b-971f2516e0cd"

[[env.dev.kv_namespaces]]
binding = "REEF_KV"
id = "b971329ac04e4171a65cfb907da0b08f"

[env.dev.vars]
ENVIRONMENT = "development"
FREE_ANALYSIS_LIMIT = "3"
CF_ACCOUNT_ID = "34fe73a21dc07a799a1ded7cc1763895"
APPLE_BUNDLE_ID = "au.com.aethers.reefbuddy"
ALLOW_SANDBOX_PURCHASES = "true"

[env.dev.vars.AI_GATEWAY]
gateway_id = "reefbuddy-ai-gateway"

[dev]
port = 8787
local_protocol = "http"
